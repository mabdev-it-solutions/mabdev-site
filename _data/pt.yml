# About Section
about:
  title: "Sobre Mim"
  subtitle: "A pessoa por trás do código"
  bio: |
    E aí! Eu sou o Vinicius, e eu realmente amo o que faço. Por mais de 15 anos, tenho resolvido quebra-cabeças de software—de plataformas e-commerce que processam milhares de pedidos diários a sistemas de armazém que mantêm operações funcionando perfeitamente.

    Mas o que realmente me motiva é ver meus clientes terem sucesso. Não há nada melhor do que ouvir "isso mudou tudo pra gente." É por isso que dedico tempo para realmente entender seu negócio antes de escrever uma única linha de código.

    Também estou empolgado com IA e como ela pode ajudar empresas a trabalhar de forma mais inteligente. Se você tem curiosidade sobre o que é possível, adoraria explorar isso com você. E sim—aceito Bitcoin com descontos especiais, porque acredito no futuro das finanças descentralizadas!
  values:
    - title: "Artesanato"
      description: "Tenho orgulho do meu trabalho. Cada projeto recebe minha atenção total e a qualidade que merece—sem atalhos."
    - title: "Seu Sucesso = Meu Sucesso"
      description: "Não fico satisfeito até você ficar satisfeito. Suas vitórias são minhas vitórias, e vou além para fazê-las acontecer."
  stats:
    - value: "15+"
      label: "Anos de Experiência"
    - value: "15+"
      label: "Projetos Entregues"
    - value: "100%"
      label: "Acesso Direto"

